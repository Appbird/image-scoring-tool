[package]
name = "imgviewer"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
eframe = { version = "0.28", features = ["wgpu"] }   # ネイティブアプリ
egui = "0.28"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "gif", "ico", "tiff", "webp"] }
walkdir = "2.5"
crossbeam-channel = "0.5"
lru = "0.12"